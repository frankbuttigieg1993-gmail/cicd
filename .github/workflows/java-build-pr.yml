name: Java Application - PR Pipeline
run-name: PR-${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}

on:
  pull_request:
    branches: [ main, release/*, develop ]
    types: [ opened, synchronize, reopened ] 
  workflow_call:
    inputs:
      target-runner:
        required: true
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: write
  id-token: write
  security-events: write
  actions: write

jobs:
    Build:
      name: Build
      runs-on: ubuntu-24.04
      outputs:
        APP_VERSION: ${{ steps.app_version.outputs.APP_VERSION }}
      steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0 
      - name: Dump GitHub PR Context
        run: echo "${{ toJson(github.event.pull_request) }}"
      - name: Set APP_VERSION Output 
        id: app_version
        run: echo "APP_VERSION=$(cat ./build.gradle | grep 'version =' | cut -d "=" -f 2 | tr -d "'" | xargs)" >> "$GITHUB_OUTPUT"
      - name: Build with Gradle
        run:  ./gradlew  dependencies build -x test -info --scan --write-locks 
        continue-on-error: false
      - name: Listing Files
        run: find . -type f
    Unit_Test:
      name: Unit_Test
      runs-on: ubuntu-24.04
      needs: [Build]
      steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Copy Sample Test Report 
        run: mkdir -p build/test-results/sample && cp -a junit-example.xml build/test-results/sample/
