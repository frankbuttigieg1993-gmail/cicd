name: Java Application - PR Pipeline
run-name: "PR-${{ github.event.pull_request.number }}:  ${{ github.event.pull_request.title }}"

on:
  workflow_call:
    inputs:
      target-runner:
        required: true
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: write  # Required for checkout and write is required for tagging the git repository
  id-token: write # This is required for requesting the JWT for OIDC auth to AWS
  security-events: write # Required for Semgrep and Uploading to GitHub Security Feature
  actions: write
  pull-requests: write
  issues: write
  statuses: write
jobs:
    Bootstrap:
      name: Bootstrap
      runs-on: ubuntu-24.04
      if: ${{ always() }}
      steps:
        - name: Bootstrap
          if: ${{ github.event_name == 'pull_request' }}
          uses: frankbuttigieg1993-gmail/cicd/.github/actions/pr-pipeline-bootstrap@main
          with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
            pr-number: ${{ github.event.pull_request.number }}
            run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            run-number: ${{ github.run_number }}
            run-attempt: ${{ github.run_attempt }}  
    Build:
      name: Build
      runs-on: ${{ fromJson(inputs.target-runner) }} 
      needs: [Bootstrap]
      steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Java Build
        uses: frankbuttigieg1993-gmail/cicd/.github/actions/java/build@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
    AI_Generate_Composite:
      name: List application files
      runs-on: ubuntu-24.04
      needs: [Build]
      permissions:
        contents: read
      steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: List current-directory files
        uses: frankbuttigieg1993-gmail/cicd/.github/actions/ai-generate-composite@feature/ai-generate-composite
    Unit_Tests:
      name: Unit_Tests
      runs-on: ubuntu-24.04
      needs: [AI_Generate_Composite]
      steps:
      - name: Java Test
        uses: frankbuttigieg1993-gmail/cicd/.github/actions/java/test@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
