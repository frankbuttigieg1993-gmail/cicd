name: Java Application - PR Pipeline
run-name: PR-${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}

on:
  pull_request:
    branches: [ main, release/*, develop ]
    types: [ opened, synchronize, reopened ] 
  workflow_call:
    inputs:
      target-runner:
        required: true
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: write
  id-token: write
  security-events: write
  actions: write

jobs:
    Build:
      name: Build
      runs-on: ${{ fromJson(inputs.target-runner) }} 
      # outputs:
      #   APP_VERSION: ${{ steps.app_version.outputs.APP_VERSION }}
      steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # - name: Set APP_VERSION Output 
      #   id: app_version
      #   run: echo "APP_VERSION=$(cat ./build.gradle | grep 'version =' | cut -d "=" -f 2 | tr -d "'" | xargs)" >> "$GITHUB_OUTPUT"
      - name: Java Build
        uses: frankbuttigieg1993-gmail/cicd/.github/actions/java/build@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}  
    Unit_Test:
      name: Unit_Test
      runs-on: ubuntu-24.04
      needs: [Build]
      steps:
      - name: Java Test
        uses: frankbuttigieg1993-gmail/cicd/.github/actions/java/test@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }} 
    Secrets-Scan:
        name: Secrets Scan 
        runs-on: ${{ fromJson(inputs.target-runner) }} 
        needs: Build
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'   # temporarily disable Node TLS checks
          GIT_SSL_NO_VERIFY: 'true'           # temporarily disable git SSL verification
        steps:
        - name: Gitleaks
          uses: frankbuttigieg1993-gmail/cicd/.github/actions/gitleaks@main
          with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
        - name: Trivy Secrets Scan
          uses: frankbuttigieg1993-gmail/cicd/.github/actions/gitletrivy-secrets-scan@main
          with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
    CycloneDX_Runtime_Vulnerability:
      name: CycloneDX Runtime Vulnerability Scan
      runs-on: ${{ fromJson(inputs.target-runner) }} 
      needs: [Build]
      steps:
      - name: CycloneDX Runtime Vulnerability Scan
        uses: frankbuttigieg1993-gmail/cicd/.github/actions/cyclonedx-runtime-sbom-vulnerabilities@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}  
    CycloneDX_SBOM:
      name: CycloneDX_SBOM
      runs-on: ${{ fromJson(inputs.target-runner) }} 
      needs: [Build]
      steps:
      - name: CycloneDX SBOM
        uses: frankbuttigieg1993-gmail/cicd/.github/actions/cyclone-dx-sbom@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}  
    sonar-scan:
        name: SonarQube Scan & Gate Check
        runs-on: ${{ fromJson(inputs.target-runner) }} 
        needs: Unit_Test
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'   # temporarily disable Node TLS checks
          GIT_SSL_NO_VERIFY: 'true'           # temporarily disable git SSL verification
        steps:
          - name: Sonar Scan Java Application
            uses: frankbuttigieg1993-gmail/cicd/.github/actions/sonar-scan@main
            with:
              github-token: ${{ secrets.GITHUB_TOKEN }}  
              sonar-token: ${{ secrets.SONAR_TOKEN }} 
      # - name: Upload Test Report files
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: unit-test-report
      #     path: build/test-results/sample/
      # - name: Publish Test Report To GitHub
      #   uses: dorny/test-reporter@v2
