# Gradle executing the sonarqube scan is the recommended way for java projects. Running it via the build tool ensures that compiled .class binaries and test coverage reports (like JaCoCo) are properly recognized without requiring complex file mapping parameters
# https://stackoverflow.com/questions/77373748/unable-to-run-sonarqube-scan-for-my-java-repository-using-github-actions
# https://docs.sonarsource.com/sonarqube-server/10.8/devops-platform-integration/github-integration/adding-analysis-to-github-actions-workflow

name: Java Application - Scanning All
run-name: ${{ github.ref_name }}-${{ github.run_number }}

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      target-runner:
        required: true
        type: string
        
defaults:
  run:
    shell: bash

env:
  AWS_REGION: ap-southeast-2                   # set this to your preferred AWS region, e.g. us-west-1
  build-artifact-key: app-${{ github.sha }}
  ECR_REPOSITORY: java-application           # set this to your Amazon ECR repository name

concurrency:
  group: ${{ github.workflow }}-runner-${{ github.ref }}
  cancel-in-progress: false

jobs:
    Build:
      name: Build
      runs-on: ${{ fromJson(inputs.target-runner) }} 
      outputs:
        APP_VERSION: ${{ steps.app_version.outputs.APP_VERSION }}
      env:
        NODE_TLS_REJECT_UNAUTHORIZED: '0'   # temporarily disable Node TLS checks
        GIT_SSL_NO_VERIFY: 'true'           # temporarily disable git SSL verification
      steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set APP_VERSION Output 
        id: app_version
        run: echo "APP_VERSION=$(cat ./build.gradle | grep 'version =' | cut -d "=" -f 2 | tr -d "'" | xargs)" >> "$GITHUB_OUTPUT"
      - name: Java Build
        uses: frankbuttigieg1993-gmail/cicd/.github/actions/java/build@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}  
