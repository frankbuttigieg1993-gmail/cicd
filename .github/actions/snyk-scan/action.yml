name: "Snyk Scan (composite)"
description: "Composite action that runs Snyk CLI against a Java repository. Intended for use in reusable workflows."
inputs:
  snyk-token:
    description: "Snyk API token (use a GitHub Secret, e.g. SNYK_TOKEN)."
    required: true
  working-directory:
    description: "Directory to run the scan from (relative to repository root)."
    required: false
    default: "java_application"
  java-version:
    description: "JDK version to set up for the run."
    required: false
    default: "17"
  severity-threshold:
    description: "Fail the test when issue severity is at or above this value (low|medium|high|critical)."
    required: false
    default: "low"
  continue-on-error:
    description: "If 'true' the action will not fail the workflow on Snyk test failures."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Install Snyk CLI
      run: npm install -g snyk
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Authenticate Snyk
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
      run: |
        if ! command -v snyk >/dev/null 2>&1; then
          echo "snyk CLI not found after install" >&2
          exit 2
        fi
        snyk auth $SNYK_TOKEN
      working-directory: ${{ inputs.working-directory }}

    - name: Run Snyk Test
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
      continue-on-error: ${{ inputs.continue-on-error }}
      run: |
        snyk test --all-projects --severity-threshold=${{ inputs.severity-threshold }}
      working-directory: ${{ inputs.working-directory }}

    - name: Upload Monitor snapshot
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
      continue-on-error: true
      run: |
        snyk monitor --all-projects || true
      working-directory: ${{ inputs.working-directory }}
