name: 'Java Build'
description: 'Java Build'

inputs:
  github-token:
    description: 'The github token'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Cache Gradle and Maven
      uses: actions/cache@v5
      with:
        path: |
          ${{ github.workspace }}/.gradle/caches
          ${{ github.workspace }}/.gradle/wrapper
          ${{ github.workspace }}/.m2/repository
        key: ${{ runner.os }}-gradle-deps-${{ hashFiles('**/*.gradle*', '**/gradle.lockfile', '**/settings.gradle*') }}
    - name: Configure Gradle user home
      shell: bash
      run: |
        echo "GRADLE_USER_HOME=${GITHUB_WORKSPACE}/.gradle" >> "$GITHUB_ENV"
    - name: Build
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}  
        NODE_TLS_REJECT_UNAUTHORIZED: "0" 
    #        run: gradle clean build test jacocoTestReport jacocoTestCoverageVerification sonar cyclonedxBom dependencies -info --scan -PignoreFailures=true --write-locks --continue
#      run: ./gradlew compileJava compileTestJava build -x test cyclonedxBom cyclonedxDirectBomRuntime dependencies -info --scan --write-locks
      run: ./gradlew compileJava compileTestJava build -x test cyclonedxRuntimeBom cyclonedxAllConfigsBom cyclonedxBuildEnvironmentBom dependencies -info --scan --write-locks
      shell: bash 
    - name: Upload Build Artefact
      uses: actions/upload-artifact@v7
      with:
        name: build
        path: | 
          build/
          gradle.lockfile
          Dockerfile
        retention-days: 1
    - name: Build Overview
      run: |
        # Generate your HTML block
        echo "<h3>🚀 Build Overview </h3>" >> $GITHUB_STEP_SUMMARY
        echo "<table border='1'><tr><th>Item</th><th>Description</th></tr><tr><td>Git Commit </td><td>${{ github.sha }}</td></tr><tr><td>Branch</td><td>${{ github.ref_name }}</td></tr><tr><td>CICD Commit</td><td>${{ job.workflow_sha }}</td></tr></table>" >> $GITHUB_STEP_SUMMARY
      shell: bash
    - uses: tiacsys/clean-after-action@v4
      if: always()