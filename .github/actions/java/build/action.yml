name: 'Java Build'
description: 'Java Build'

inputs:
  github-token:
    description: 'The github token'
    required: true

runs:
  using: 'composite'
  steps:
# We have 3 runners on a self hosted VM. We need relative gradle and trivy directories to avoid conflicts. We cater for this through 'cache directories' step above
# This configuration is useful when you aren't using self hosted slaves (eg: github runners or ephemeral slaves)

      # - name: Cache Gradle and Maven
      #   uses: actions/cache@v5
      #   with:
      #     path: |
      #       ~/.gradle/caches
      #       ~/.gradle/wrapper
      #       ~/m2/repository
      #     key: ${{ runner.os }}-gradle-deps-${{ hashFiles('**/*.gradle*', '**/gradle.lockfile', '**/settings.gradle*') }}

      # Setup Cache Directories for Self Hosted Runners. You don't want runners to share the gradle cache directory. 
      # Gradle is smart at managing task dependencies and perform gradle tasks simulatenously that it's aware of however it won't be aware of other gradle tasks being managed by other runners 
      # Therefore a separate gradle cache per runner makes the most sense since only 1 job can execute at any given time per runner. 
    - name: Configure cache directories
      shell: bash
      run: |
        echo "GRADLE_USER_HOME=${HOME}/.gradle-runners/${{ runner.name }}.cache/gradle" >> "$GITHUB_ENV"
    - name: Build
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}  
        NODE_TLS_REJECT_UNAUTHORIZED: "0" 
    #        run: gradle clean build test jacocoTestReport jacocoTestCoverageVerification sonar cyclonedxBom dependencies -info --scan -PignoreFailures=true --write-locks --continue
#      run: ./gradlew compileJava compileTestJava build -x test cyclonedxBom cyclonedxDirectBomRuntime dependencies -info --scan --write-locks
      run: ./gradlew assemble -info
      shell: bash 
    - name: Upload Build Artefact
      uses: actions/upload-artifact@v7
      with:
        name: build
        path: | 
          build/
          gradle.lockfile
          Dockerfile
        retention-days: 1
    - name: Build Overview
      run: |
        # Generate your HTML block
        echo "<h3>🚀 Build Overview </h3>" >> $GITHUB_STEP_SUMMARY
        echo "<table border='1'><tr><th>Item</th><th>Description</th></tr><tr><td>Git Commit </td><td>${{ github.sha }}</td></tr><tr><td>Branch</td><td>${{ github.ref_name }}</td></tr><tr><td>CICD Commit</td><td>${{ job.workflow_sha }}</td></tr></table>" >> $GITHUB_STEP_SUMMARY
      shell: bash
    - uses: tiacsys/clean-after-action@v4
      if: always()