name: 'Run Java Tests'
description: 'Run Java Tests'

inputs:
  github-token:
    description: 'The github token'
    required: true

# HTML test report	build/reports/tests/test/index.html
# JUnit XML results	build/test-results/test/
# JaCoCo HTML coverage	build/reports/jacoco/test/html/index.html
# JaCoCo XML coverage	build/reports/jacoco/test/jacocoTestReport.xml

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Download Build Artefact
      uses: actions/download-artifact@v8
      with:
        name: build
        path: .
    - name: Configure Build Cache
      uses: $/.github/actions/common/configure-build-cache
    - name: Run Unit Tests
      id: run_tests
      run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification -PignoreFailures=true -info --stacktrace --continue
      continue-on-error: true
      shell: bash
    - name: Publish Test Report to GitHub
      uses: dorny/test-reporter@v3
      with:
        name: junit-test-results
        path: 'build/test-results/test/*.xml'
        reporter: java-junit
        fail-on-empty: false
        only-summary: 'true'
        fail-on-error: false
    - name: Upload Unit Test and Coverage Reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports
        path: | 
          build/reports/
          build/test-results/
          build/reports/jacoco/
        retention-days: 1
        if-no-files-found: warn
    - name: Read JUnit Test Results
      id: junit_results
      run: python "${{ github.action_path }}/resources/check-test-results.py"
      shell: bash
    - name: Enforce Test and Coverage Results
      env:
        GRADLE_OUTCOME: ${{ steps.run_tests.outcome }}
        TEST_COUNT: ${{ steps.junit_results.outputs.tests }}
        FAILED_TEST_COUNT: ${{ steps.junit_results.outputs['failed-tests'] }}
      run: |
        if [[ "$GRADLE_OUTCOME" != "success" ]]; then
          echo "::error::Gradle test or coverage tasks failed (outcome: $GRADLE_OUTCOME)."
          exit 1
        fi
        if [[ -z "$TEST_COUNT" || "$TEST_COUNT" -eq 0 ]]; then
          echo "::error::No JUnit test results were produced."
          exit 1
        fi
        if [[ -z "$FAILED_TEST_COUNT" || "$FAILED_TEST_COUNT" -ne 0 ]]; then
          echo "::error::$FAILED_TEST_COUNT JUnit tests failed or errored."
          exit 1
        fi
      shell: bash
    - name: Cleanup runner
      if: always()
      uses: tiacsys/clean-after-action@v4