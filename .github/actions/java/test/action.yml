name: 'Run Java Tests'
description: 'Run Java Tests'

inputs:
  github-token:
    description: 'The github token'
    required: true

# HTML test report	build/reports/tests/test/index.html
# JUnit XML results	build/test-results/test/
# JaCoCo HTML coverage	build/reports/jacoco/test/html/index.html
# JaCoCo XML coverage	build/reports/jacoco/test/jacocoTestReport.xml

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Download Build Artefact
      uses: actions/download-artifact@v8
      with:
        name: build
        path: .
    - name: Configure Build Cache
      uses: frankbuttigieg1993-gmail/cicd/.github/actions/common/configure-build-cache@main
    - name: Run Unit Tests
      run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification -PignoreFailures=true -info --stacktrace --continue
      continue-on-error: true
      shell: bash
    - name: Publish Test Report to GitHub
      uses: dorny/test-reporter@v3
      with:
        name: junit-test-results
        path: 'build/test-results/test/*.xml'
        reporter: java-junit
        fail-on-empty: false
        only-summary: 'true'
        fail-on-error: false
    - name: Upload Unit Test and Coverage Reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports
        path: | 
          build/reports/
          build/test-results/
          build/reports/jacoco/
        retention-days: 1
        if-no-files-found: warn
    - uses: tiacsys/clean-after-action@v4