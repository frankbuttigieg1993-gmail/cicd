name: 'Test the Java Application'
description: 'Test the Java Application'

inputs:
  github-token:
    description: 'The github token'
    required: true
  sonar-token:
    description: 'The sonar token'
    required: true

# HTML test report	build/reports/tests/test/index.html
# JUnit XML results	build/test-results/test/
# JaCoCo HTML coverage	build/reports/jacoco/test/html/index.html
# JaCoCo XML coverage	build/reports/jacoco/test/jacocoTestReport.xml

runs:
  using: 'composite'
  steps:
    # Every shell step in a composite action MUST explicitly define the shell
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Download Build Artefact
      uses: actions/download-artifact@v4
      with:
        name: build
        path: .
    - name: Run Tests and Coverage
      run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification -PignoreFailures=true -info --stacktrace --continue
      continue-on-error: true
    - name: Publish Test Report to GitHub
      uses: dorny/test-reporter@v1
      with:
        name: junit-test-results
        path: 'build/test-results/test/*.xml'
        reporter: java-junit
        fail-on-empty: false
  #          list-suites: all
  #          list-tests: all
  #          use-actions-summary: true
        fail-on-error: false
    - name: Upload JaCoCo HTML Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: build/reports/jacoco/test/html
        retention-days: 1
    - name: Upload HTML Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: html-test-report
        path: build/reports/tests/test/
        retention-days: 1
    - name: Upload test and coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-and-coverage-reports
        path: | 
          build/reports/
          build/test-results/
        retention-days: 1
    - uses: tiacsys/clean-after-action@v3