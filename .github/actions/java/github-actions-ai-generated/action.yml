name: github-actions-ai-generated
description: Build and test a Gradle project, run SonarQube analysis, and enforce its quality gate

inputs:
  java-version:
    description: Java version used to build the project
    required: false
    default: "21"
  java-distribution:
    description: JDK distribution supported by actions/setup-java
    required: false
    default: temurin
  working-directory:
    description: Directory containing the Gradle wrapper
    required: false
    default: .
  build-tasks:
    description: Whitespace-separated Gradle build tasks
    required: false
    default: assemble
  test-tasks:
    description: Whitespace-separated Gradle test tasks
    required: false
    default: test
  sonar-token:
    description: SonarQube authentication token; pass it from a GitHub secret
    required: true
  sonar-host-url:
    description: SonarQube server URL
    required: true
  sonar-project-key:
    description: Optional SonarQube project key (otherwise use the Gradle project configuration)
    required: false
    default: ""
  sonar-pull-request-key:
    description: Optional pull request number for SonarQube pull-request analysis
    required: false
    default: ""
  sonar-pull-request-branch:
    description: Optional source branch for SonarQube pull-request analysis
    required: false
    default: ""
  sonar-pull-request-base:
    description: Optional target branch for SonarQube pull-request analysis
    required: false
    default: ""
  sonar-quality-gate-timeout:
    description: Maximum seconds to wait for the SonarQube quality gate
    required: false
    default: "300"

outputs:
  build-status:
    description: Outcome of the Gradle build tasks
    value: ${{ steps.gradle-build.outcome }}
  test-status:
    description: Outcome of the Gradle test tasks
    value: ${{ steps.gradle-test.outcome }}
  sonar-status:
    description: Outcome of the SonarQube analysis
    value: ${{ steps.sonar-analysis.outcome }}
  quality-gate-status:
    description: PASSED only when SonarQube analysis and the enforced quality gate succeed
    value: ${{ steps.sonar-analysis.outcome == 'success' && 'PASSED' || 'NOT_PASSED' }}
  report-artifact-url:
    description: URL of the uploaded Gradle and SonarQube reports, if any were generated
    value: ${{ steps.upload-reports.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - name: Set up Java
      id: setup-java
      uses: actions/setup-java@v4
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}
        cache: gradle

    - name: Gradle build
      id: gradle-build
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GRADLE_TASKS: ${{ inputs.build-tasks }}
      run: bash "${{ github.action_path }}/resources/run-gradle-tasks.sh"

    - name: Gradle tests
      id: gradle-test
      if: always() && steps.setup-java.outcome == 'success'
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GRADLE_TASKS: ${{ inputs.test-tasks }}
      run: bash "${{ github.action_path }}/resources/run-gradle-tasks.sh"

    - name: SonarQube analysis and quality gate
      id: sonar-analysis
      if: always() && steps.setup-java.outcome == 'success'
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        SONAR_PROJECT_KEY: ${{ inputs.sonar-project-key }}
        SONAR_PULL_REQUEST_KEY: ${{ inputs.sonar-pull-request-key }}
        SONAR_PULL_REQUEST_BRANCH: ${{ inputs.sonar-pull-request-branch }}
        SONAR_PULL_REQUEST_BASE: ${{ inputs.sonar-pull-request-base }}
        SONAR_QUALITY_GATE_TIMEOUT: ${{ inputs.sonar-quality-gate-timeout }}
      run: bash "${{ github.action_path }}/resources/run-sonar-analysis.sh"

    - name: Upload Gradle and SonarQube reports
      id: upload-reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: github-actions-ai-generated-reports
        path: |
          ${{ inputs.working-directory }}/build/reports/
          ${{ inputs.working-directory }}/build/test-results/
          ${{ inputs.working-directory }}/build/sonar/report-task.txt
        if-no-files-found: warn
        retention-days: 7

    - name: Write build and analysis summary
      id: write-summary
      if: always()
      shell: bash
      env:
        SETUP_STATUS: ${{ steps.setup-java.outcome }}
        BUILD_STATUS: ${{ steps.gradle-build.outcome }}
        TEST_STATUS: ${{ steps.gradle-test.outcome }}
        SONAR_STATUS: ${{ steps.sonar-analysis.outcome }}
        QUALITY_GATE_STATUS: ${{ steps.sonar-analysis.outcome == 'success' && 'PASSED' || 'NOT_PASSED' }}
        REPORT_ARTIFACT_URL: ${{ steps.upload-reports.outputs.artifact-url }}
      run: bash "${{ github.action_path }}/resources/write-step-summary.sh"

    - name: Enforce build, test, and quality gate results
      if: always()
      shell: bash
      env:
        SETUP_STATUS: ${{ steps.setup-java.outcome }}
        BUILD_STATUS: ${{ steps.gradle-build.outcome }}
        TEST_STATUS: ${{ steps.gradle-test.outcome }}
        SONAR_STATUS: ${{ steps.sonar-analysis.outcome }}
        REPORT_STATUS: ${{ steps.upload-reports.outcome }}
        SUMMARY_STATUS: ${{ steps.write-summary.outcome }}
      run: |
        set -euo pipefail
        failed=0
        for result in \
          "Java setup:${SETUP_STATUS}" \
          "Gradle build:${BUILD_STATUS}" \
          "Gradle tests:${TEST_STATUS}" \
          "SonarQube analysis and quality gate:${SONAR_STATUS}" \
          "Report upload:${REPORT_STATUS}" \
          "Step summary:${SUMMARY_STATUS}"; do
          name=${result%%:*}
          status=${result#*:}
          if [[ "$status" != "success" ]]; then
            echo "::error::$name did not succeed (status: ${status:-unknown}); see the corresponding step logs."
            failed=1
          fi
        done
        exit "$failed"
