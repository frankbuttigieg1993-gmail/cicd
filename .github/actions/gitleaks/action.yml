name: 'GitLeaks Secret Scan'
description: 'Git-aware secret scanning with Gitleaks, SARIF reporting, artifact upload, optional PR summary, and enforcement.'

inputs:
  github-token:
    description: 'GitHub token used to upload SARIF, upload reports, and update the PR comment.'
    required: true
  enforce-policy:
    description: 'Fail this action when Gitleaks detects secrets or encounters a scan error.'
    required: false
    default: 'true'

outputs:
  finding-count:
    description: 'Number of Gitleaks findings reported in SARIF.'
    value: ${{ steps.summary.outputs.findings }}
  scan-error:
    description: Whether the Gitleaks scan encountered an execution error
    value: ${{ steps.gitleaks.outputs.scan-error }}

runs:
  using: 'composite'
  steps:
    - name: Bootstrap 
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/reports/gitleaks

    - name: Run Gitleaks against Git history
      id: gitleaks
      shell: bash
      run: |
        bash "${{ github.action_path }}/resources/run-gitleaks.sh"

    - name: Summarise Gitleaks results
      id: summary
      shell: bash
      run: |
        set -euo pipefail
        SARIF="build/reports/gitleaks/gitleaks.sarif"
        FINDINGS=$(jq '[.runs[]?.results[]?] | length' "$SARIF")
        echo "findings=${FINDINGS}" >> "$GITHUB_OUTPUT"

    - name: Generate Gitleaks HTML report
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        python3 "${{ github.action_path }}/resources/generate-gitleaks-html.py" \
          --sarif build/reports/gitleaks/gitleaks.sarif \
          --output build/reports/gitleaks/gitleaks-report.html

    - name: Upload Gitleaks SARIF
      if: ${{ always() && github.event_name != 'pull_request' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: build/reports/gitleaks/gitleaks.sarif
        category: gitleaks-secrets

    - name: Build Gitleaks report artifact
      shell: bash
      run: |
        set -euo pipefail
        jq '.' build/reports/gitleaks/gitleaks.sarif > build/reports/gitleaks/gitleaks-pretty.sarif

    - name: Create or update Gitleaks PR comment
      id: gitleaks-pr-comment
      if: ${{ always() && github.event_name == 'pull_request' }}
      continue-on-error: true
      shell: bash
      env:
        EXIT_CODE: ${{ steps.gitleaks.outputs.exit-code }}
        FINDINGS: ${{ steps.summary.outputs.findings }}
        GH_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        bash "${{ github.action_path }}/resources/publish-gitleaks-pr-comment.sh"

    # - name: Warn when Gitleaks PR comment cannot be published
    #   if: ${{ always() && steps.gitleaks-pr-comment.outcome == 'failure' }}
    #   shell: bash
    #   run: |
    #     echo "::warning::Gitleaks findings were processed, but the PR comment could not be published. Check workflow permissions for pull-requests/issues write access."

    - name: Determine Gitleaks scan status
      id: gitleaks-status
      if: always()
      shell: bash
      env:
        EXIT_CODE: ${{ steps.gitleaks.outputs.exit-code || '2' }}
      run: |
        set -euo pipefail
        if [[ "$EXIT_CODE" == "0" || "$EXIT_CODE" == "1" ]]; then
          echo "scan-error=0" >> "$GITHUB_OUTPUT"
        else
          echo "scan-error=1" >> "$GITHUB_OUTPUT"
        fi

    - name: Enforce Gitleaks policy
      if: ${{ always() && inputs.enforce-policy == 'true' }}
      shell: bash
      env:
        EXIT_CODE: ${{ steps.gitleaks.outputs.exit-code }}
        FINDINGS: ${{ steps.summary.outputs.findings }}
      run: |
        set -euo pipefail

        if [[ "$EXIT_CODE" != "0" || "$FINDINGS" -gt 0 ]]; then
          echo "Gitleaks policy failed: exit=${EXIT_CODE}, findings=${FINDINGS}"
          exit 1
        fi
        echo "Gitleaks policy passed."
    # The 'Secrets Scan' job runs the Gitleaks and then Trivy Secrets composite actions so we don't want to clean the directory after gitleaks runs
    # - name: Clean up Gitleaks workspace
    #   if: always()
    #   uses: tiacsys/clean-after-action@v4