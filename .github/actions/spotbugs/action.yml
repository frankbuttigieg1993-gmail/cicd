# SpotBugs scan is an application production-code static analysis scan of the Gradle main source set, enhanced with FindSecBugs security detectors.
# This composite action performs a Main application bytecode, broad/deep SpotBugs analysis, plus FindSecBugs security detectors.

name: 'SpotBugs and FindSecBugs'
description: 'Runs SpotBugs with FindSecBugs, produces SARIF and HTML reports, uploads SARIF, maintains a sticky PR summary comment, and fails on critical findings.'

inputs:
  github-token:
    description: 'GitHub token used for SARIF upload and PR comments.'
    required: true

outputs:
  critical-count:
    description: 'Number of critical findings.'
    value: ${{ steps.spotbugs-policy.outputs.critical-count }}
  finding-count:
    description: 'Total findings.'
    value: ${{ steps.spotbugs-policy.outputs.finding-count }}
  sarif-file:
    description: 'SARIF report path.'
    value: build/reports/spotbugs/main/spotbugs.sarif
  html-file:
    description: 'HTML report path.'
    value: build/reports/spotbugs/main/spotbugs.html

runs:
  using: composite
  steps:
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
 
    # The Gradle task runs during this step, always returns an Exit Code of 0 and then we evaluate the failure later on so that we can still run the other steps
    - name: Run SpotBugs and FindSecBugs
      id: spotbugs
      shell: bash
      run: |
        bash "${{ github.action_path }}/resources/run-spotbugs.sh"

    - name: Evaluate SpotBugs security policy
      id: spotbugs-policy
      if: ${{ always() && steps.spotbugs.outputs.sarif-generated == 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        python3 "${{ github.action_path }}/resources/check-spotbugs-critical.py" \
          --sarif build/reports/spotbugs/main/spotbugs.sarif \
          --github-output "$GITHUB_OUTPUT" \
          --summary build/reports/spotbugs/main/spotbugs-summary.md

    - name: Add SpotBugs report to GitHub Step Summary
      if: always()
      shell: bash
      run: |
        bash "${{ github.action_path }}/resources/write-step-summary.sh"

    - name: Upload SpotBugs SARIF Report to Github Security Dashboard
      if: ${{ always() && steps.spotbugs.outputs.sarif-generated == 'true' && github.event_name != 'pull_request' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: build/reports/spotbugs/main/spotbugs.sarif
        category: spotbugs-findsecbugs

    - name: Upload SpotBugs reports
      if: ${{ always()}}
      uses: actions/upload-artifact@v7
      with:
        name: spotbugs-findsecbugs-reports
        path: |
          build/reports/spotbugs/main/spotbugs.html
          build/reports/spotbugs/main/spotbugs.sarif
          build/reports/spotbugs/main/spotbugs.xml
          build/reports/spotbugs/main/spotbugs-summary.md
        retention-days: 7

    - name: Publish SpotBugs summary to Pull Request
      if: ${{ always() && github.event_name == 'pull_request' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        bash "${{ github.action_path }}/resources/update-pr-comment.sh"

    - name: Enforce critical SpotBugs policy
      if: always()
      shell: bash
      env:
        CRITICAL_COUNT: ${{ steps.spotbugs-policy.outputs.critical-count || '0' }}
        GRADLE_EXIT_CODE: ${{ steps.spotbugs.outputs.gradle-exit-code || '1' }}
        SARIF_GENERATED: ${{ steps.spotbugs.outputs.sarif-generated || 'false' }}
      run: |
        bash "${{ github.action_path }}/resources/enforce-policy.sh"

    - name: Clean up SpotBugs workspace
      if: always()
      uses: tiacsys/clean-after-action@v4
