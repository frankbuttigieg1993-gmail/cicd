name: 'Semgrep Scan'
description: 'Run Semgrep AppSec Platform scans and publish results.'

inputs:
  github-token:
    description: 'GitHub token.'
    required: true
  SEMGREP_APP_TOKEN:
    description: 'Semgrep AppSec Platform CI token.'
    required: true
  semgrep-project-url:
    description: 'Semgrep AppSec Platform project URL.'
    required: false
    default: 'https://semgrep.dev/orgs/frank_buttigieg_1993_personal_org/projects/6365517'

runs:
  using: 'composite'
  steps:
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Download Build Artefact
      uses: actions/download-artifact@v8
      with:
        name: build
        path: .

    - name: Bootstrap
      shell: bash
      run: |
        mkdir -p build/reports/semgrep
        python -m pip install --upgrade pip
        python -m pip install semgrep==1.163.0 Jinja2

    - name: Semgrep AppSec Platform Analysis
      id: semgrep-scan
      shell: bash
      env:
        SEMGREP_APP_TOKEN: ${{ inputs.SEMGREP_APP_TOKEN }}
        SEMGREP_PROJECT_URL: ${{ inputs.semgrep-project-url }}
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: bash "${{ github.action_path }}/resources/run-semgrep.sh"

    - name: Resolve Semgrep AppSec Platform scan details
      id: semgrep-details
      if: ${{ always() && steps.semgrep-scan.outputs.scan-id != '' }}
      shell: bash
      env:
        SEMGREP_APP_TOKEN: ${{ inputs.SEMGREP_APP_TOKEN }}
        SCAN_ID: ${{ steps.semgrep-scan.outputs.scan-id }}
        SEMGREP_BRANCH: ${{ github.head_ref || github.ref_name }}
      run: bash "${{ github.action_path }}/resources/resolve-semgrep-scan-details.sh"

    - name: Summarize Semgrep SARIF results
      id: semgrep-summary
      shell: bash
      run: python3 "${{ github.action_path }}/resources/summarize-semgrep-sarif.py"

    - name: Publish GitHub Step Summary
      if: always()
      shell: bash
      env:
        PROJECT_URL: ${{ inputs.semgrep-project-url }}
        SCAN_ID: ${{ steps.semgrep-scan.outputs.scan-id }}
        SCAN_URL: ${{ steps.semgrep-scan.outputs.scan-url }}
        CODE_FINDINGS_URL: ${{ steps.semgrep-details.outputs.code-findings-url }}
        SUPPLY_CHAIN_FINDINGS_URL: ${{ steps.semgrep-details.outputs.supply-chain-findings-url }}
        CODE_FINDINGS: ${{ steps.semgrep-details.outputs.code-findings || '0' }}
        SUPPLY_CHAIN_FINDINGS: ${{ steps.semgrep-details.outputs.supply-chain-findings || '0' }}
        SECRETS_FINDINGS: ${{ steps.semgrep-details.outputs.secrets-findings || '0' }}
        PLATFORM_TOTAL_FINDINGS: ${{ steps.semgrep-details.outputs.total-findings || '0' }}
        SEMGREP_BRANCH: ${{ github.head_ref || github.ref_name }}
        SEMGREP_EXIT_CODE: ${{ steps.semgrep-scan.outputs.exit-code || '1' }}
        SCAN_MODE: ${{ steps.semgrep-scan.outputs.mode }}
        BASELINE: ${{ steps.semgrep-scan.outputs.baseline }}
      run: bash "${{ github.action_path }}/resources/write-step-summary.sh"

    - name: Publish Semgrep PR comment
      if: ${{ always() && github.event_name == 'pull_request' }}
      continue-on-error: true
      shell: bash
      env:
        PROJECT_URL: ${{ inputs.semgrep-project-url }}
        SCAN_ID: ${{ steps.semgrep-scan.outputs.scan-id }}
        SCAN_URL: ${{ steps.semgrep-scan.outputs.scan-url }}
        CODE_FINDINGS_URL: ${{ steps.semgrep-details.outputs.code-findings-url }}
        SUPPLY_CHAIN_FINDINGS_URL: ${{ steps.semgrep-details.outputs.supply-chain-findings-url }}
        CODE_FINDINGS: ${{ steps.semgrep-details.outputs.code-findings || '0' }}
        SUPPLY_CHAIN_FINDINGS: ${{ steps.semgrep-details.outputs.supply-chain-findings || '0' }}
        SECRETS_FINDINGS: ${{ steps.semgrep-details.outputs.secrets-findings || '0' }}
        PLATFORM_TOTAL_FINDINGS: ${{ steps.semgrep-details.outputs.total-findings || '0' }}
        SEMGREP_BRANCH: ${{ github.head_ref || github.ref_name }}
        SEMGREP_EXIT_CODE: ${{ steps.semgrep-scan.outputs.exit-code || '1' }}
        SCAN_MODE: ${{ steps.semgrep-scan.outputs.mode }}
        BASELINE: ${{ steps.semgrep-scan.outputs.baseline }}
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: bash "${{ github.action_path }}/resources/publish-pr-comment.sh"
