name: Semgrep Scan
description: Run Semgrep AppSec Platform Code and Supply Chain scans, publish SARIF/HTML reports, summarize findings, maintain a sticky PR comment, and link to the Semgrep project/scan.

inputs:
  github-token:
    description: GitHub token used to upload SARIF and create/update the PR comment. The calling workflow controls its permissions.
    required: true
  SEMGREP_APP_TOKEN:
    description: Semgrep AppSec Platform CI token.
    required: true
  semgrep-project-url:
    description: Semgrep AppSec Platform project URL.
    required: false
    default: 'https://semgrep.dev/orgs/frank_buttigieg_1993_personal_org/projects/6365517'
  semgrep-scan-url:
    description: Optional exact Semgrep scan URL. When supplied, it is used in the Step Summary and PR comment.
    required: false
    default: ''
  pr-comment:
    description: Create or update the sticky Semgrep summary comment for pull requests.
    required: false
    default: 'true'
  upload-sarif:
    description: Upload the Semgrep SARIF report to GitHub Code Scanning.
    required: false
    default: 'true'
  upload-report:
    description: Upload Semgrep SARIF and HTML reports as a workflow artifact.
    required: false
    default: 'true'
  enforce-policy:
    description: Fail the composite action after reporting when semgrep ci returns a non-zero result.
    required: false
    default: 'true'

outputs:
  exit-code:
    description: Exit code returned by semgrep ci.
    value: ${{ steps.semgrep-scan.outputs.exit-code }}
  sarif-file:
    description: Path to the Semgrep SARIF report.
    value: ${{ steps.semgrep-scan.outputs.sarif-file }}
  error-count:
    description: Number of SARIF error-level findings.
    value: ${{ steps.semgrep-summary.outputs.error-count }}
  warning-count:
    description: Number of SARIF warning-level findings.
    value: ${{ steps.semgrep-summary.outputs.warning-count }}
  note-count:
    description: Number of SARIF note-level findings.
    value: ${{ steps.semgrep-summary.outputs.note-count }}
  total-findings:
    description: Total number of SARIF findings.
    value: ${{ steps.semgrep-summary.outputs.total-findings }}

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Download Build Artefact
      uses: actions/download-artifact@v8
      with:
        name: build
        path: .

    - name: Bootstrap
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/reports/semgrep

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Semgrep
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install semgrep==1.163.0
        python -m pip install Jinja2

    - name: Get current date
      id: date
      shell: bash
      run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

    - name: Run Semgrep AppSec Platform Analysis
      id: semgrep-scan
      shell: bash
      env:
        SEMGREP_APP_TOKEN: ${{ inputs.SEMGREP_APP_TOKEN }}
      run: |
        set +e

        BASELINE=""
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          BASELINE="${{ github.event.pull_request.base.sha }}"
        fi

        echo "========================================"
        echo "Starting Semgrep AppSec Platform Scan"
        echo "Scan mode: $([[ -n "$BASELINE" ]] && echo "diff-aware" || echo "full")"
        echo "Baseline: ${BASELINE:-none}"
        echo "========================================"

        ARGS=(
          ci
          --supply-chain
          --code
          --metrics=off
          --sarif
          --sarif-output=build/reports/semgrep/semgrep.sarif
          --exclude=.cache/
          --verbose
          --no-suppress-errors
        )

        if [[ -n "$BASELINE" ]]; then
          ARGS+=(--baseline-commit "$BASELINE")
        fi

        semgrep "${ARGS[@]}"
        EXIT_CODE=$?

        echo "exit-code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
        echo "sarif-file=build/reports/semgrep/semgrep.sarif" >> "$GITHUB_OUTPUT"

        exit 0

    - name: Summarise Semgrep SARIF
      id: semgrep-summary
      if: always()
      shell: bash
      run: |
        python3 "${{ github.action_path }}/resources/summarize-semgrep-sarif.py"           --sarif build/reports/semgrep/semgrep.sarif           --github-output "$GITHUB_OUTPUT"

    - name: Determine Semgrep links
      id: semgrep-links
      if: always()
      shell: bash
      env:
        PROJECT_URL: ${{ inputs.semgrep-project-url }}
        PROVIDED_SCAN_URL: ${{ inputs.semgrep-scan-url }}
      run: |
        set -euo pipefail

        SCAN_URL="$PROVIDED_SCAN_URL"

        if [[ -z "$SCAN_URL" ]]; then
          # The CLI does not expose a stable scan URL as a documented output.
          # Use the supplied project URL as the durable platform destination.
          SCAN_URL="$PROJECT_URL"
        fi

        echo "project-url=$PROJECT_URL" >> "$GITHUB_OUTPUT"
        echo "scan-url=$SCAN_URL" >> "$GITHUB_OUTPUT"

    - name: Generate Semgrep Step Summary
      if: always()
      shell: bash
      env:
        PROJECT_URL: ${{ steps.semgrep-links.outputs.project-url }}
        SCAN_URL: ${{ steps.semgrep-links.outputs.scan-url }}
        TOTAL: ${{ steps.semgrep-summary.outputs.total-findings || '0' }}
        ERRORS: ${{ steps.semgrep-summary.outputs.error-count || '0' }}
        WARNINGS: ${{ steps.semgrep-summary.outputs.warning-count || '0' }}
        NOTES: ${{ steps.semgrep-summary.outputs.note-count || '0' }}
        EXIT_CODE: ${{ steps.semgrep-scan.outputs.exit-code || '0' }}
      run: |
        {
          echo "## Semgrep AppSec Platform"
          echo
          echo "**Total findings:** ${TOTAL}"
          echo
          echo "| Level | Count |"
          echo "|---|---:|"
          echo "| Error | ${ERRORS} |"
          echo "| Warning | ${WARNINGS} |"
          echo "| Note | ${NOTES} |"
          echo
          echo "[Open Semgrep AppSec Project](${PROJECT_URL})"
          echo
          echo "[Open Semgrep Scan](${SCAN_URL})"
          echo
          echo "[View GitHub Actions Run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          echo
          echo "**Semgrep exit code:** ${EXIT_CODE}"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Build Semgrep PR Comment
      id: semgrep-pr-comment
      if: ${{ always() && inputs.pr-comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        PROJECT_URL: ${{ steps.semgrep-links.outputs.project-url }}
        SCAN_URL: ${{ steps.semgrep-links.outputs.scan-url }}
        TOTAL: ${{ steps.semgrep-summary.outputs.total-findings || '0' }}
        ERRORS: ${{ steps.semgrep-summary.outputs.error-count || '0' }}
        WARNINGS: ${{ steps.semgrep-summary.outputs.warning-count || '0' }}
        NOTES: ${{ steps.semgrep-summary.outputs.note-count || '0' }}
      run: |
        cat > build/reports/semgrep/semgrep-comment.md <<EOF
        <!-- semgrep-appsec-summary -->
        ## Semgrep AppSec Platform

        **Total findings:** ${TOTAL}  
        **Errors:** ${ERRORS}  
        **Warnings:** ${WARNINGS}  
        **Notes:** ${NOTES}

        [Open Semgrep AppSec Project](${PROJECT_URL})  
        [Open Semgrep Scan](${SCAN_URL})  
        [View GitHub Actions Run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
        EOF

    - name: Create or update Semgrep PR comment
      if: ${{ always() && inputs.pr-comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      continue-on-error: true
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        python3 "${{ github.action_path }}/resources/update-semgrep-pr-comment.py"           --repo "$GH_REPO"           --pr "$PR_NUMBER"           --body-file build/reports/semgrep/semgrep-comment.md           --token "$GH_TOKEN"

    - name: Upload Semgrep SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' && github.event_name != 'pull_request' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: build/reports/semgrep/semgrep.sarif
        category: semgrep-appsec

    - name: Upload Semgrep Reports
      if: ${{ always() && inputs.upload-report == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: semgrep-reports
        path: build/reports/semgrep/
        retention-days: 2

    - name: Enforce Semgrep Policy
      if: ${{ always() && inputs.enforce-policy == 'true' }}
      shell: bash
      run: |
        EXIT_CODE="${{ steps.semgrep-scan.outputs.exit-code || '0' }}"
        if [[ "$EXIT_CODE" != "0" ]]; then
          echo "::error::Semgrep AppSec policy failed with exit code ${EXIT_CODE}."
          exit "$EXIT_CODE"
        fi
        echo "Semgrep AppSec policy passed."
