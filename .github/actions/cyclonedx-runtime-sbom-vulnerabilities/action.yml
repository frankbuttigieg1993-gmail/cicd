name: 'CycloneDX Runtime Vulnerabilities and Compliance Check'
description: 'CycloneDX Runtime Vulnerabilities and Compliance Check'

inputs:
  github-token:
    description: 'The github token'
    required: true
  sonar-token:
    description: 'The sonar token'
    required: true
  trivy-version:
    description: 'Trivy CLI version'
    required: false
    default: '0.72.0'
# pipx install cyclonedx-bom

runs:
  using: 'composite'
  steps:
#    Every shell step in a composite action MUST explicitly define the shell
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download Build Artefact
        uses: actions/download-artifact@v8
        with:
          name: build
          path: .

      # Keep tool caches inside the job workspace so concurrent self-hosted
      # runner jobs do not share the same writable cache directories.
      - name: Configure cache directories
        shell: bash
        run: |
          echo "GRADLE_USER_HOME=${GITHUB_WORKSPACE}/.gradle" >> "$GITHUB_ENV"
          echo "TRIVY_CACHE_DIR=${GITHUB_WORKSPACE}/.cache/trivy" >> "$GITHUB_ENV"

      # Use a daily Trivy DB key. If today's cache does not exist, actions/cache
      # restores the newest cache for this OS and Trivy can update it as needed.
      - name: Get Trivy database cache date
        id: trivy-cache-date
        shell: bash
        run: |
          echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy Databases
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.trivy-cache-date.outputs.date }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # Trivy CLI is installed once and then reused by all scans below.
      # The setup action version is deliberately independent from the Trivy CLI version.
      - name: Setup Trivy CLI
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: ${{ inputs.trivy-version }}
          cache: true

      - name: Verify Trivy version
        run: trivy --version
        shell: bash

      - name: Cache Gradle and Maven
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.gradle/caches
            ${{ github.workspace }}/.gradle/wrapper
            ${{ github.workspace }}/.m2/repository
          key: ${{ runner.os }}-gradle-deps-${{ hashFiles('**/*.gradle*', '**/gradle.lockfile', '**/settings.gradle*') }}
      # Generate a CycloneDX dependency graph. The custom source-code HTML report
      # uses this graph to classify vulnerable Java components as direct or transitive.
      - name: Warm dependency cache and generate SBOMs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            cyclonedxRuntimeBom \
            cyclonedxAllConfigsBom \
            cyclonedxBuildEnvironmentBom \
            dependencies \
            build \
            -x test \
            -info \
            --scan \
            --write-locks

##############################  Runtime SBOM Severity Level 6 Check #########################################################

      - name: Enforce Runtime SBOM CVSS Policy
        id: runtime-sbom-policy
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          # The Gradle task writes a Markdown summary even when the policy fails.
          # Temporarily disable immediate exit so the summary can be published,
          # then return Gradle's original exit code to preserve the build gate.
          set +e
          ./gradlew --no-daemon verifyRuntimeSbomVulnerabilities
          GRADLE_EXIT_CODE=$?
          set -e

          POLICY_SUMMARY="build/reports/cyclonedx/runtime-vulnerability-policy.md"
          if [ -f "$POLICY_SUMMARY" ]; then
            cat "$POLICY_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Runtime SBOM Vulnerability Policy"
              echo
              echo "**Result:** ERROR"
              echo
              echo "The Gradle policy task did not produce its expected Markdown report."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$GRADLE_EXIT_CODE"
        shell: bash

      # Publish the report only when the CVSS policy step failed.
      - name: Publish Runtime SBOM Policy to Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          POLICY_REPORT_PATH: build/reports/cyclonedx/runtime-vulnerability-policy.md
        with:
          github-token: ${{ inputs.github-token }}
          script: |
            const publishPolicy = require('${{ github.action_path }}/resources/publish-runtime-sbom-policy.js');
            await publishPolicy({ github, context, core });

      # continue-on-error above is only used so the PR comment can be published.
      # Restore the security gate's failure after the comment step has run.
      - name: Fail Runtime SBOM CVSS Policy
        if: steps.runtime-sbom-policy.outcome == 'failure'
        shell: bash
        run: |
          echo "Runtime SBOM CVSS policy failed."
          exit 1

      - name: Upload Reports 
        uses: actions/upload-artifact@master
        if: always()
        with:
            name: cyclonedx-runtime-sbom-vulnerabilities-report
            path: | 
             build/reports/cyclonedx/runtime-vulnerability-policy.*
            retention-days: 1
      - uses: tiacsys/clean-after-action@v4
