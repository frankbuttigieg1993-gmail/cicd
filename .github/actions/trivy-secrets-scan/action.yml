# Design Notes:

# 1) This action is intentionally separate from the main Trivy vulnerability/license/configuration action.
# It is dedicated to detecting exposed API keys, passwords, private keys, tokens and other credentials.
# 2) Gitleaks remains the dedicated Git-history scanner. This Trivy action answers a different question:
#    - Filesystem: Is a secret present in the current source/build workspace?
#    - Packaged JAR: Did a secret survive application packaging?
#    - Container image: Did a secret survive into the final deployable image?
# 3) The scans are kept separate so a single secret propagating through source -> JAR -> image is visible as
# a propagation path rather than being confused with three unrelated secrets.
# 4) Generated reports and Git metadata are excluded from the filesystem scan to reduce duplicate/noisy findings.
# 5) The action captures scan results first, uploads SARIF/artifacts and updates the PR comment, and only then
# enforces the secret policy. This ensures developers receive useful diagnostics even when the security gate fails.
# 6) The action never includes detected secret values in its PR summary.
# 7) The GitHub token permissions and repository merge protection remain the responsibility of the calling workflow/repository.
# 8) The Github action for trivy scans isn't maintained regularly. So we moved away from using the github action to
# installing trivy separately and running CLI commands so we can ensure we are using the required Trivy version.

name: 'Trivy Secret Scan'
description: 'Trivy secret scanning for the current filesystem, packaged JAR, and container image with SARIF, artifacts, sticky PR summary, and enforcement.'

inputs:
  trivy-version:
    description: 'Trivy CLI version to install.'
    required: false
    default: '0.74.0'
  github-token:
    description: 'GitHub token used for PR comments. Permissions are configured by the calling workflow.'
    required: true
  pr-comment:
    description: 'Create or update a sticky pull request comment for Trivy secret scans.'
    required: false
    default: 'true'
  upload-sarif:
    description: 'Upload Trivy secret SARIF reports to GitHub Code Scanning.'
    required: false
    default: 'true'
  upload-report:
    description: 'Upload Trivy secret reports as a workflow artifact.'
    required: false
    default: 'true'
  enforce-policy:
    description: 'Fail the action if a secret is detected or a secret scan fails.'
    required: false
    default: 'true'
  scan-filesystem:
    description: 'Scan the current source/build workspace for secrets.'
    required: false
    default: 'true'
  scan-jar:
    description: 'Scan the packaged JAR for secrets.'
    required: false
    default: 'true'
  scan-image:
    description: 'Scan the container image for secrets.'
    required: false
    default: 'true'
  image-ref:
    description: 'Container image reference to scan'
    required: false
    default: ''
  build-artifact-name:
    description: 'Name of the workflow artifact containing the application build output.'
    required: false
    default: 'build'

outputs:
  exit-code:
    description: '0 if clean, 1 if secrets are detected, 2 if a scan error occurs.'
    value: ${{ steps.secret-gate.outputs.exit-code }}
  filesystem-secret-count:
    description: 'Filesystem secret finding count.'
    value: ${{ steps.secret-summary.outputs.filesystem }}
  jar-secret-count:
    description: 'Packaged JAR secret finding count.'
    value: ${{ steps.secret-summary.outputs.jar }}
  image-secret-count:
    description: 'Container image secret finding count.'
    value: ${{ steps.secret-summary.outputs.image }}
  total-secret-count:
    description: 'Total findings across enabled Trivy secret scan stages.'
    value: ${{ steps.secret-summary.outputs.total }}

runs:
  using: 'composite'
  steps:
    # Every shell step in a composite action MUST explicitly define the shell.
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Bootstrap
      shell: bash
      run: |
        set -euo pipefail
        echo "TRIVY_CACHE_DIR=${GITHUB_WORKSPACE}/.cache/trivy" >> "$GITHUB_ENV"
        echo "TRIVY_SECRET_CONFIG=${{ github.action_path }}/resources/trivy-secret.yaml" >> "$GITHUB_ENV"
        mkdir -p "${GITHUB_WORKSPACE}/.cache/trivy" build/reports/trivy-secrets

    - name: Install Trivy
      shell: bash
      env:
        TRIVY_VERSION: ${{ inputs.trivy-version }}
      run: |
        set -euo pipefail

        VERSION="${TRIVY_VERSION#v}"
        ARCH="$(uname -m)"
        case "$ARCH" in
          x86_64|amd64) TRIVY_ARCH="64bit" ;;
          aarch64|arm64) TRIVY_ARCH="ARM64" ;;
          *)
            echo "::error::Unsupported runner architecture: ${ARCH}"
            exit 1
            ;;
        esac

        TMP_DIR="$(mktemp -d)"
        trap 'rm -rf "$TMP_DIR"' EXIT

        curl --fail --silent --show-error --location           "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-${TRIVY_ARCH}.tar.gz"           --output "${TMP_DIR}/trivy.tar.gz"

        tar -xzf "${TMP_DIR}/trivy.tar.gz" -C "$TMP_DIR" trivy
        mkdir -p "${RUNNER_TEMP}/trivy-bin"
        install -m 0755 "${TMP_DIR}/trivy" "${RUNNER_TEMP}/trivy-bin/trivy"
        echo "${RUNNER_TEMP}/trivy-bin" >> "$GITHUB_PATH"

        "${RUNNER_TEMP}/trivy-bin/trivy" --version

    - name: Get current date
      id: date
      shell: bash
      run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

    # - name: Cache Trivy databases
    #   uses: actions/cache@v5
    #   with:
    #     path: ${{ github.workspace }}/.cache/trivy
    #     # Refresh the database cache once a day, while allowing older caches to restore.
    #     key: trivy-db-${{ runner.os }}-${{ steps.date.outputs.date }}
    #     restore-keys: |
    #       trivy-db-${{ runner.os }}-

    # Secret scan of the current source/build workspace. Git metadata, Gradle caches and generated reports
    # are skipped to reduce duplicate findings. The build directory is not globally excluded because the
    # packaged JAR is scanned separately and may have been downloaded into build/libs.
    - name: Trivy filesystem secret scan
      id: fs-secrets
      if: ${{ inputs.scan-filesystem == 'true' }}
      shell: bash
      run: |
        bash "${{ github.action_path }}/resources/run-secret-scan.sh" \
          fs . \
          build/reports/trivy-secrets/trivy-filesystem-secrets.json \
          build/reports/trivy-secrets/trivy-filesystem-secrets.sarif \
          --skip-dirs .git \
          --skip-dirs .gradle \
          --skip-dirs build/reports

    - name: Upload filesystem secrets SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' && inputs.scan-filesystem == 'true' && steps.fs-secrets.outputs.scan-error != '1' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: build/reports/trivy-secrets/trivy-filesystem-secrets.sarif
        category: trivy-filesystem-secrets

    # The packaged JAR scan detects credentials that survived the build/package process.
    - name: Download Build Artefact
      if: ${{ inputs.scan-jar == 'true' }}
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.build-artifact-name }}
        path: .

    - name: Extract packaged JAR
      id: jar-prepare
      if: ${{ inputs.scan-jar == 'true' }}
      shell: bash
      run: bash "${{ github.action_path }}/resources/prepare-jar.sh"

    - name: Trivy packaged JAR secret scan
      id: jar-secrets
      if: ${{ inputs.scan-jar == 'true' && steps.jar-prepare.outputs.available == 'true' }}
      shell: bash
      run: |
        bash "${{ github.action_path }}/resources/run-secret-scan.sh" \
          rootfs build/trivy-secret-jar-rootfs \
          build/reports/trivy-secrets/trivy-jar-secrets.json \
          build/reports/trivy-secrets/trivy-jar-secrets.sarif \
          --skip-dirs META-INF/maven

    - name: Upload packaged JAR secrets SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' && inputs.scan-jar == 'true' && steps.jar-prepare.outputs.available == 'true' && steps.jar-secrets.outputs.scan-error != '1' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: build/reports/trivy-secrets/trivy-jar-secrets.sarif
        category: trivy-packaged-jar-secrets

    # The image scan detects credentials that survived into the final deployable container image.
    # If image-ref is supplied, the existing local image is scanned. Otherwise this action builds the image.
    - name: Resolve or build Docker image
      id: docker-image
      if: ${{ inputs.scan-image == 'true' }}
      shell: bash
      env:
        INPUT_IMAGE_REF: ${{ inputs.image-ref }}
      run: |
        set -euo pipefail
        if [[ -n "$INPUT_IMAGE_REF" ]]; then
          IMAGE_REF="$INPUT_IMAGE_REF"
        else
          IMAGE_REF="java-application:${GITHUB_SHA}"
          docker build -t "$IMAGE_REF" .
        fi
        echo "image-ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

    - name: Trivy Docker image secret scan
      id: image-secrets
      if: ${{ inputs.scan-image == 'true' }}
      shell: bash
      env:
        IMAGE_REF: ${{ steps.docker-image.outputs.image-ref }}
      run: |
        bash "${{ github.action_path }}/resources/run-secret-scan.sh" \
          image "$IMAGE_REF" \
          build/reports/trivy-secrets/trivy-image-secrets.json \
          build/reports/trivy-secrets/trivy-image-secrets.sarif

    - name: Upload Docker image secrets SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' && inputs.scan-image == 'true' && steps.image-secrets.outputs.scan-error != '1' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: build/reports/trivy-secrets/trivy-image-secrets.sarif
        category: trivy-docker-image-secrets

    - name: Summarise Trivy secret scans
      id: secret-summary
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        FS_COUNT="${{ steps.fs-secrets.outputs.count || '0' }}"
        JAR_COUNT="${{ steps.jar-secrets.outputs.count || '0' }}"
        IMAGE_COUNT="${{ steps.image-secrets.outputs.count || '0' }}"
        TOTAL=$((FS_COUNT + JAR_COUNT + IMAGE_COUNT))
        echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"
        echo "filesystem=${FS_COUNT}" >> "$GITHUB_OUTPUT"
        echo "jar=${JAR_COUNT}" >> "$GITHUB_OUTPUT"
        echo "image=${IMAGE_COUNT}" >> "$GITHUB_OUTPUT"

    - name: Build Trivy secret PR comment
      if: ${{ always() && inputs.pr-comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        FS_COUNT: ${{ steps.secret-summary.outputs.filesystem }}
        JAR_COUNT: ${{ steps.secret-summary.outputs.jar }}
        IMAGE_COUNT: ${{ steps.secret-summary.outputs.image }}
        TOTAL_COUNT: ${{ steps.secret-summary.outputs.total }}
        FS_ERROR: ${{ steps.fs-secrets.outputs.scan-error || '0' }}
        JAR_ERROR: ${{ steps.jar-secrets.outputs.scan-error || '0' }}
        IMAGE_ERROR: ${{ steps.image-secrets.outputs.scan-error || '0' }}
      run: bash "${{ github.action_path }}/resources/build-pr-comment.sh"

    - name: Generate Trivy secret HTML report
      if: always()
      shell: bash
      env:
        FS_COUNT: ${{ steps.secret-summary.outputs.filesystem || '0' }}
        JAR_COUNT: ${{ steps.secret-summary.outputs.jar || '0' }}
        IMAGE_COUNT: ${{ steps.secret-summary.outputs.image || '0' }}
        TOTAL_COUNT: ${{ steps.secret-summary.outputs.total || '0' }}
        FS_ERROR: ${{ steps.fs-secrets.outputs.scan-error || '0' }}
        JAR_ERROR: ${{ steps.jar-secrets.outputs.scan-error || '0' }}
        IMAGE_ERROR: ${{ steps.image-secrets.outputs.scan-error || '0' }}
      run: |
        set -euo pipefail
        python3 "${{ github.action_path }}/resources/generate-trivy-secrets-html.py" \
          --output build/reports/trivy-secrets/trivy-secrets-report.html

    - name: Create or update Trivy secret PR comment
      if: ${{ always() && inputs.pr-comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: bash "${{ github.action_path }}/resources/upsert-pr-comment.sh"

    - name: Determine Trivy secret gate
      id: secret-gate
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        TOTAL="${{ steps.secret-summary.outputs.total || '0' }}"
        FS_ERROR="${{ steps.fs-secrets.outputs.scan-error || '0' }}"
        JAR_ERROR="${{ steps.jar-secrets.outputs.scan-error || '0' }}"
        IMAGE_ERROR="${{ steps.image-secrets.outputs.scan-error || '0' }}"

        if (( TOTAL > 0 )); then
          EXIT_CODE=1
        elif [[ "$FS_ERROR" == "1" || "$JAR_ERROR" == "1" || "$IMAGE_ERROR" == "1" ]]; then
          EXIT_CODE=2
        else
          EXIT_CODE=0
        fi
        echo "exit-code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

    - name: Upload Trivy secret reports
      if: ${{ always() && inputs.upload-report == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: trivy-secret-reports
        path: build/reports/trivy-secrets/

    # Enforcement is deliberately last so SARIF, artifacts and the PR summary are still published on failure.
    - name: Enforce Trivy secret policy
      if: ${{ always() && inputs.enforce-policy == 'true' }}
      shell: bash
      env:
        EXIT_CODE: ${{ steps.secret-gate.outputs.exit-code }}
      run: |
        set -euo pipefail
        if [[ "$EXIT_CODE" != "0" ]]; then
          echo "Trivy secret policy failed with exit code ${EXIT_CODE}."
          exit 1
        fi
        echo "Trivy secret policy passed."