rules:
  - id: generic-hardcoded-api-key
    category: general
    title: Hard-coded API key
    severity: HIGH
    keywords:
      - apiKey
      - apikey
      - api_key
      - api-key
    regex: '(?i)(?P<key>api[_-]?key)\s*(?:=|:)\s*["'"'](?P<secret>[A-Za-z0-9._+=/-]{8,512})["'"']'
    secret-group-name: secret

  - id: generic-hardcoded-password
    category: general
    title: Hard-coded password
    severity: HIGH
    keywords:
      - password
      - passwd
    regex: '(?i)(?P<key>password|passwd)\s*(?:=|:)\s*["'"'](?P<secret>[^"'"']{8,512})["'"']'
    secret-group-name: secret

  - id: generic-hardcoded-client-secret
    category: general
    title: Hard-coded client secret
    severity: HIGH
    keywords:
      - clientSecret
      - client_secret
      - client-secret
    regex: '(?i)(?P<key>client[_-]?secret)\s*(?:=|:)\s*["'"'](?P<secret>[^"'"']{8,512})["'"']'
    secret-group-name: secret

  - id: generic-hardcoded-access-token
    category: general
    title: Hard-coded access token
    severity: HIGH
    keywords:
      - accessToken
      - access_token
      - access-token
    regex: '(?i)(?P<key>access[_-]?token)\s*(?:=|:)\s*["'"'](?P<secret>[A-Za-z0-9._+=/-]{8,512})["'"']'
    secret-group-name: secret

  - id: gradle-hardcoded-credential-property
    category: general
    title: Hard-coded Gradle credential property
    severity: HIGH
    path: '.*\.(gradle|gradle\.kts|properties)$'
    keywords:
      - password
      - apiKey
      - api_key
      - clientSecret
      - client_secret
      - accessToken
      - access_token
    regex: '(?i)(?P<key>password|passwd|api[_-]?key|client[_-]?secret|access[_-]?token)["'"']?\s*(?:,|=|:)\s*["'"'](?P<secret>[^"'"']{8,512})["'"']'
    secret-group-name: secret
