name: Secrets Scan
description: Run Gitleaks and Trivy secret scans and enforce a single combined security policy.

inputs:
  github-token:
    description: GitHub token
    required: true

# The composite actions for gitleaks and trivy secrets scan is configured to accept the 'enforce policy' flag. 
# This flag tells the composite action to run the commands, not return an error code if the scans fail and then the final gate calculated the result of the 'secrets scan' at the end
# This provides 1 level of enforcement and that we only have 1 error from this composite action

runs:
  using: composite

  steps:
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Gitleaks
      id: gitleaks
      continue-on-error: true
      uses: frankbuttigieg1993-gmail/cicd/.github/actions/gitleaks@main
      with:
        github-token: ${{ inputs.github-token }}
        enforce-policy: 'false'
        pr-comment: 'false'

    - name: Trivy Secrets Scan
      id: trivy
      uses: frankbuttigieg1993-gmail/cicd/.github/actions/trivy-secrets-scan@main
      with:
        github-token: ${{ inputs.github-token }}
        enforce-policy: 'false'

    # Reports are deliberately published before the combined security gate
    # is enforced so they remain available when findings are detected.
    - name: Publish Secrets Scan Reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: secrets-scan-reports
        path: |
          build/reports/gitleaks/
          build/reports/trivy-secrets/
          build/reports/secrets-scan/
        retention-days: 2
        if-no-files-found: warn
    - name: Publish Secrets Scan Summary
      if: always()
      shell: bash
      env:
        GITLEAKS_FINDINGS: ${{ steps.gitleaks.outputs.finding-count || '0' }}
        GITLEAKS_SCAN_ERROR: ${{ steps.gitleaks.outputs.scan-error || '0' }}

        TRIVY_FINDINGS: ${{ steps.trivy.outputs.total-secret-count || '0' }}
        TRIVY_SCAN_ERROR: ${{ steps.trivy.outputs.scan-error || '0' }}
      run: |
        bash "${{ github.action_path }}/resources/write-secrets-summary.sh"

    # For pull requests, publish the same combined Secrets Scan summary as a
    # single sticky PR comment. The Gitleaks-specific PR comment is disabled
    # above so the PR receives only the combined Secrets Scan comment.
    - name: Publish Secrets Scan PR Comment
      if: ${{ always() && github.event_name == 'pull_request' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        SUMMARY_FILE: build/reports/secrets-scan/secrets-scan-summary.md
      run: |
        bash "${{ github.action_path }}/resources/publish-secrets-pr-comment.sh"

    # This is the only step in this composite action that should fail because
    # of the combined secret-scanning policy.
    - name: Enforce Secrets Scan Policy
      if: always()
      shell: bash
      env:
        GITLEAKS_FINDINGS: ${{ steps.gitleaks.outputs.finding-count || '0' }}
        GITLEAKS_SCAN_ERROR: ${{ steps.gitleaks.outputs.scan-error || '0' }}

        TRIVY_FINDINGS: ${{ steps.trivy.outputs.total-secret-count || '0' }}
        TRIVY_SCAN_ERROR: ${{ steps.trivy.outputs.scan-error || '0' }}
      run: |
        bash "${{ github.action_path }}/resources/enforce-secrets-policy.sh"

    - name: Clean workspace
      if: always()
      uses: tiacsys/clean-after-action@v4