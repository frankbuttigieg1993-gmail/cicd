name: 'OWASP Dependency Check Analysis'
description: 'Dependency Check Analysis'

# OWASP Dependency Check has a tendency to generate more false positve results than the other tools in my tool chain however it uses a different matching approach which sometimes can pick up issues other scanners don't.
# However you would need to triage the findings and amintain supression lists for known false positive and we have sufficient coverage from the other tools.
# You can use it as an independnecy secondary scanner but only include it if you have a specific requirement for it

# | Tool                       | False-positive / noise tendency                       | Strength                               |
# | -------------------------- | ----------------------------------------------------- | -------------------------------------- |
# | GitHub Dependency Review   | Relatively low                                        | Newly introduced dependencies          |
# | Dependabot                 | Relatively low                                        | Ecosystem-aware advisories/remediation |
# | CycloneDX + Trivy          | Low–moderate                                          | Strong package/SBOM matching           |
# | Semgrep Supply Chain       | Lower actionable noise when reachability is available | Reachability/context                   |
# | **OWASP Dependency-Check** | **Moderate, sometimes high**                          | Independent NVD/CPE-based detection    |


inputs:
  github-token:
    description: 'The github token'
    required: true

runs:
  using: 'composite'
  steps:
  - name: Checkout
    uses: actions/checkout@v6
  - name: Download Build Artefact
    uses: actions/download-artifact@v8
    with:
      name: build
      path: .
  - name: Configure Build Cache
    uses: frankbuttigieg1993-gmail/cicd/.github/actions/common/configure-build-cache@main
  - name: Cache Dependency-Check data
    uses: actions/cache@v5
    with:
      path: ~/.cache/dependency-check
      key: odc-${{ runner.os }}-12.2.2-${{ hashFiles('**/gradle.lockfile', '**/build.gradle', '**/settings.gradle') }}
      restore-keys: |
        odc-${{ runner.os }}-12.2.2-
  - name: Produce DependencyCheck Report
    env:
      GITHUB_TOKEN: ${{ inputs.github-token }}  
      NODE_TLS_REJECT_UNAUTHORIZED: "0" 
    run: ./gradlew dependencyCheckAnalyze 
    shell: bash 
  - name: Publish Report
    uses: actions/upload-artifact@master
    with:
        name: Depcheck report
        path: build/reports/dependency-check/dependency-check-report.html
        retention-days: 1
  - uses: tiacsys/clean-after-action@v4