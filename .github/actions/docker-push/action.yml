name: 'Docker Push'
description: 'Docker Push'

inputs:
  github-token:
    description: 'The github token'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        clean: true
    # - name: Verify AWS Identity
    #   run: |
    #     aws sts get-caller-identity
    #     aws s3 ls
    #   shell: bash
    - name: Download Build Artefact
      uses: actions/download-artifact@v8
      with:
        name: build
        path: .
    - name: "Configure AWS Credentials"
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ap-southeast-2 
        role-to-assume: arn:aws:iam::865983312994:role/github-actions-role
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1
    - name: Docker Build 
      id: Docker-Build 
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        APP_VERSION: ${{ inputs.app-version }}
      run: |
        APP_VERSION=$(cat ./build.gradle | grep 'version =' | cut -d "=" -f 2 | tr -d "'" | xargs)
        echo "BRANCH_NAME_ESCAPED=$( echo ${{ github.ref_name }} | tr "/" _  )" >> $GITHUB_ENV
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} -t $ECR_REGISTRY/$ECR_REPOSITORY:$APP_VERSION -t $ECR_REGISTRY/$ECR_REPOSITORY:$APP_VERSION.${{ github.run_number }} .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$APP_VERSION
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$APP_VERSION.${{ github.run_number }}
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" >> $GITHUB_OUTPUT
      shell: bash
    - uses: tiacsys/clean-after-action@v4