name: 'CycloneDX SBOM Analysis'
description: 'CycloneDX SBOM Analysis'

inputs:
  github-token:
    description: 'The github token'
    required: true
  sonar-token:
    description: 'The sonar token'
    required: true
  produce-build-environment-sbom:
    description: 'Should I produce the complete Build Environment SBOM'
    required: false
    default: 'false'
  trivy-version:
    description: 'Trivy CLI version to install and use'
    required: false
    default: '0.74.0'

runs:
  using: 'composite'
  steps:
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Download Build Artefact
        uses: actions/download-artifact@v8
        with:
          name: build
          path: .

      - name: Configure Build Cache
        uses: frankbuttigieg1993-gmail/cicd/.github/actions/common/configure-build-cache@main

      - name: Setup Trivy
        uses: frankbuttigieg1993-gmail/cicd/.github/actions/common/setup-trivy@main
      
      - name: Generate Runtime and Application SBOM
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            cyclonedxRuntimeBom \
            cyclonedxApplicationBom 

      - name: Generate Build Environment SBOM
        if: ${{ inputs.produce-build-environment-sbom == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon cyclonedxBuildEnvironmentBom

##############################  Runtime SBOM #########################################################

      - name: Generate CSV Version of Runtime SBOM 
        run: |
           cyclonedx convert --input-file build/reports/cyclonedx/runtime-bom.json --output-file build/reports/cyclonedx/runtime-bom.csv --output-format csv
        shell: bash 

      - name: Scan Runtime SBOM with Trivy
        run: |
          trivy sbom --cache-dir "$TRIVY_CACHE_DIR" --scanners vuln,license --format json --output build/reports/cyclonedx/trivy-runtime-bom.json build/reports/cyclonedx/runtime-bom.json
        shell: bash 

      - name: Convert Runtime SBOM Vulnerabilities to SARIF
        run: |
          trivy convert \
            --format sarif \
            --output build/reports/cyclonedx/trivy-runtime-bom.sarif \
            build/reports/cyclonedx/trivy-runtime-bom.json
        shell: bash

      - name: Upload Runtime SBOM SARIF
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/cyclonedx/trivy-runtime-bom.sarif
          category: trivy-runtime-sbom

      - name: Generate TRIVY Enhanced Runtime SBOM HTML Report
        run: |
          python3 ${{ github.action_path }}/resources/generate_sbom_report.py --sbom build/reports/cyclonedx/runtime-bom.json --trivy build/reports/cyclonedx/trivy-runtime-bom.json --output build/reports/cyclonedx/runtime-bom.html --title "Runtime Dependency SBOM Report"
        shell: bash 

##############################  Application SBOM #########################################################

      - name: Generate CSV Version of Complete Application SBOM 
        run: |
           cyclonedx convert --input-file build/reports/cyclonedx/application-sbom.json --output-file build/reports/cyclonedx/application-sbom.csv --output-format csv
        shell: bash 

      - name: Scan Complete Application SBOM with Trivy
        run: |
          trivy sbom --cache-dir "$TRIVY_CACHE_DIR" --scanners vuln,license --format json --output build/reports/cyclonedx/trivy-application-sbom.json build/reports/cyclonedx/application-sbom.json
        shell: bash 

      - name: Convert Complete Application SBOM Vulnerabilities to SARIF
        run: |
          trivy convert \
            --format sarif \
            --output build/reports/cyclonedx/trivy-application-sbom.sarif \
            build/reports/cyclonedx/trivy-application-sbom.json
        shell: bash

      - name: Upload Complete Application SBOM SARIF
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/cyclonedx/trivy-application-sbom.sarif
          category: trivy-application-sbom

      - name: Generate TRIVY Enhanced Application SBOM HTML Report
        run: |
          python3 ${{ github.action_path }}/resources/generate_sbom_report.py --sbom build/reports/cyclonedx/application-sbom.json --trivy build/reports/cyclonedx/trivy-application-sbom.json --output build/reports/cyclonedx/application-sbom.html --title "Application SBOM Report"
        shell: bash 

##############################  Build Environment SBOM #########################################################


      - name: Generate CSV Version of Build Environment SBOM 
        if: ${{ inputs.produce-build-environment-sbom == 'true' }}
        run: |
           cyclonedx convert --input-file build/reports/cyclonedx/build-environment-bom.json --output-file build/reports/cyclonedx/build-environment-bom.csv --output-format csv
        shell: bash    

      - name: Scan Build Environment SBOM with Trivy
        if: ${{ inputs.produce-build-environment-sbom == 'true' }}
        run: |
          trivy sbom --cache-dir "$TRIVY_CACHE_DIR" --scanners vuln,license --format json --output build/reports/cyclonedx/trivy-build-environment-bom.json build/reports/cyclonedx/build-environment-bom.json
        shell: bash 

      - name: Convert Build Application SBOM Vulnerabilities to SARIF
        if: ${{ inputs.produce-build-environment-sbom == 'true' }}
        run: |
          trivy convert \
            --format sarif \
            --output build/reports/cyclonedx/trivy-build-environment-bom.sarif \
            build/reports/cyclonedx/trivy-build-environment-bom.json
        shell: bash

      - name: Upload Complete Application SBOM SARIF
        if: ${{ inputs.produce-build-environment-sbom == 'true' && github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/cyclonedx/trivy-build-environment-bom.sarif
          category: trivy-build-environment-sbom
        
      - name: Generate TRIVY Enhanced Complete SBOM HTML Report
        if: ${{ inputs.produce-build-environment-sbom == 'true' }}
        run: |
          python3 ${{ github.action_path }}/resources/generate_sbom_report.py --sbom build/reports/cyclonedx/build-environment-bom.json --trivy build/reports/cyclonedx/trivy-build-environment-bom.json --output build/reports/cyclonedx/build-environment-bom.html --title "Build Environment SBOM Report"
        shell: bash 

##############################  Upload Reports #########################################################

      - name: Upload Reports 
        uses: actions/upload-artifact@master
        if: always()
        with:
            name: sbom-reports
            path: | 
             build/reports/cyclonedx/
            retention-days: 1
            if-no-files-found: error
      - uses: tiacsys/clean-after-action@v4
        if: always()