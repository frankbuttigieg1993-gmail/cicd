name: 'Sonar Scan'
description: 'Sonar Scan with SonarQube Quality Gate reporting for PRs and any pushed branch'

inputs:
  github-token:
    description: 'GitHub token used to create/update the PR comment'
    required: true
  sonar-token:
    description: 'SonarQube token'
    required: true
  sonar-host-url:
    description: 'SonarQube server URL reachable from the self-hosted runner'
    required: false
    default: 'http://127.0.0.1:9300'

runs:
  using: 'composite'
  steps:
    - name: Check out repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Download Build Artefact
      uses: actions/download-artifact@v8
      with:
        name: build
        path: .

    - name: Download Test Reports
      uses: actions/download-artifact@v8
      with:
        name: test-and-coverage-reports
        path: .

    - name: Configure workspace-local cache directories
      shell: bash
      run: |
        echo "GRADLE_USER_HOME=${GITHUB_WORKSPACE}/.gradle" >> "$GITHUB_ENV"
        echo "SONAR_USER_HOME=${GITHUB_WORKSPACE}/.sonar" >> "$GITHUB_ENV"

    - name: Cache Gradle and Maven
      uses: actions/cache@v5
      with:
        path: |
          ${{ github.workspace }}/.gradle/caches
          ${{ github.workspace }}/.gradle/wrapper
          ${{ github.workspace }}/.m2/repository
        key: ${{ runner.os }}-gradle-deps-${{ hashFiles('**/*.gradle*', '**/gradle.lockfile', '**/settings.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-deps-

    - name: Cache SonarQube packages
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: |
          ${{ runner.os }}-sonar

    # - name: Configure SonarQube New Code
    #   shell: bash
    #   env:
    #     SONAR_TOKEN: ${{ inputs.sonar-token }}
    #     SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
    #   run: |
    #     curl --fail --silent --show-error \
    #       -u "${SONAR_TOKEN}:" \
    #       -X POST \
    #       "${SONAR_HOST_URL}/api/new_code_periods/set" \
    #       --data-urlencode "project=java-application" \
    #       --data-urlencode "branch=${GITHUB_REF_NAME}" \
    #       --data-urlencode "type=NUMBER_OF_DAYS" \
    #       --data-urlencode "value=30"

    - name: Execute Sonar Scan
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
      run: |
        ./gradlew build sonar -info --stacktrace -x test \
          -Dsonar.userHome="${SONAR_USER_HOME}" \
          -Dsonar.branch.name="${GITHUB_REF_NAME}"
      shell: bash

    # SonarQube itself is the source of truth. Poll the CE task, resolve the
    # analysisId, query the quality gate for that exact analysis, publish the
    # result, and expose the gate status for the enforcement step below.
    - name: Resolve and publish SonarQube result
      id: sonar-result
      if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        EVENT_NAME: ${{ github.event_name }}
        GIT_REF: ${{ github.ref }}
      run: bash "${{ github.action_path }}/resources/resolve-sonarqube-result.sh"

    # Enforce exactly the status returned by SonarQube for the analysis above.
    # ERROR/WARN/NONE all block the pipeline; only OK passes.
    - name: Enforce SonarQube Quality Gate
      if: always()
      shell: bash
      env:
        GATE_STATUS: ${{ steps.sonar-result.outputs.gate-status }}
      run: |
        if [[ "$GATE_STATUS" != 'OK' ]]; then
          echo "::error::SonarQube Quality Gate did not pass (status=${GATE_STATUS:-UNKNOWN})."
          exit 1
        fi
        echo 'SonarQube Quality Gate passed.'

    # - name: Publish to Step Summary
    #   run: |
    #     echo "The Quality Gate status is ${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}"
    #     echo "The Quality Gate status is ${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}" >> $GITHUB_STEP_SUMMARY
    #     cat build/sonar/report-task.txt >> $GITHUB_STEP_SUMMARY
    #   shell: bash

    - uses: tiacsys/clean-after-action@v4
      if: always()