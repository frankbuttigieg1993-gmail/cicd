      - name: Generate CSV Version of SBOM 
        run: |
           cyclonedx convert --input-file build/reports/cyclonedx/bom.json --output-file build/reports/cyclonedx/bom.csv --output-format csv
        shell: bash 
      - name: Scan SBOM with Trivy
        run: |
          trivy sbom --scanners vuln,license --format json --output trivy-sbom.json build/reports/cyclonedx/bom.json
        shell: bash 
      - name: Generate TRIVY Enhanced SBOM Report
        run: |
          python3 trivy/generate_sbom_report-v8.py --sbom build/reports/cyclonedx/bom.json --trivy trivy-sbom.json --output build/reports/cyclonedx/bom.html
        shell: bash 
      - name: Upload Reports 
        uses: actions/upload-artifact@master
        with:
            name: sbom-reports
            path: | 
             build/reports/cyclonedx/bom.json
             build/reports/cyclonedx/bom.xml
             build/reports/cyclonedx/bom.csv
             build/reports/cyclonedx/bom.html
            retention-days: 1
