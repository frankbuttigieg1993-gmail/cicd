name: 'CycloneDX SBOM Analysis'
description: 'CycloneDX SBOM Analysis'

inputs:
  github-token:
    description: 'The github token'
    required: true
  sonar-token:
    description: 'The sonar token'
    required: true
  trivy-version:
    description: 'The Trivy CLI version'
    required: false
    default: '0.72.0'
# pipx install cyclonedx-bom

runs:
  using: 'composite'
  steps:
#    Every shell step in a composite action MUST explicitly define the shell
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download Build Artefact
        uses: actions/download-artifact@v8
        with:
          name: build
          path: .

      # Keep tool caches inside the job workspace. This avoids concurrent jobs on
      # self-hosted runners sharing the same writable cache directories.
      - name: Configure cache directories
        shell: bash
        run: |
          echo "GRADLE_USER_HOME=${GITHUB_WORKSPACE}/.gradle" >> "$GITHUB_ENV"
          echo "TRIVY_CACHE_DIR=${GITHUB_WORKSPACE}/.cache/trivy" >> "$GITHUB_ENV"

      # Use a daily Trivy database cache key. If today's database cache does not
      # exist, actions/cache can restore the most recent older database as a base.
      - name: Get Trivy database cache date
        id: trivy-cache-date
        shell: bash
        run: |
          echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy Databases
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.trivy-cache-date.outputs.date }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # Trivy CLI is installed once and then reused by all scans below.
      # setup-trivy's cache is for the CLI; actions/cache above persists the Trivy DB.
      - name: Setup Trivy CLI
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: ${{ inputs.trivy-version }}
          cache: true

      - name: Verify Trivy version
        run: trivy --version
        shell: bash

      - name: Cache Gradle and Maven
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.gradle/caches
            ${{ github.workspace }}/.gradle/wrapper
            ${{ github.workspace }}/.m2/repository
          key: ${{ runner.os }}-gradle-deps-${{ hashFiles('**/*.gradle*', '**/gradle.lockfile', '**/settings.gradle*') }}
      # Generate a CycloneDX dependency graph. The custom source-code HTML report
      # uses this graph to classify vulnerable Java components as direct or transitive.
      - name: Warm dependency cache and generate SBOMs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            cyclonedxRuntimeBom \
            cyclonedxAllConfigsBom \
            cyclonedxBuildEnvironmentBom \
            dependencies \
            build \
            -x test \
            -info \
            --scan \
            --write-locks

##############################  Runtime SBOM #########################################################

      - name: Generate CSV Version of Runtime SBOM 
        run: |
           cyclonedx convert --input-file build/reports/cyclonedx/runtime-bom.json --output-file build/reports/cyclonedx/runtime-bom.csv --output-format csv
        shell: bash 

      - name: Scan Runtime SBOM with Trivy
        run: |
          trivy sbom --cache-dir "$TRIVY_CACHE_DIR" --scanners vuln,license --format json --output build/reports/cyclonedx/trivy-runtime-bom.json build/reports/cyclonedx/runtime-bom.json
        shell: bash 

      - name: Convert Runtime SBOM Vulnerabilities to SARIF
        run: |
          trivy convert \
            --format sarif \
            --output build/reports/cyclonedx/trivy-runtime-bom.sarif \
            build/reports/cyclonedx/trivy-runtime-bom.json
        shell: bash

      - name: Upload Runtime SBOM SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/cyclonedx/trivy-runtime-bom.sarif
          category: trivy-runtime-sbom

      - name: Generate TRIVY Enhanced Runtime SBOM Report
        run: |
          python3 ${{ github.workspace }}/trivy/generate_sbom_report-v8.py --sbom build/reports/cyclonedx/runtime-bom.json --trivy build/reports/cyclonedx/trivy-runtime-bom.json --output build/reports/cyclonedx/runtime-bom.html
        shell: bash 

##############################  Application SBOM #########################################################

      - name: Generate CSV Version of Complete Application SBOM 
        run: |
           cyclonedx convert --input-file build/reports/cyclonedx/all-configs-bom.json --output-file build/reports/cyclonedx/all-configs-bom.csv --output-format csv
        shell: bash 

      - name: Scan Complete Application SBOM with Trivy
        run: |
          trivy sbom --cache-dir "$TRIVY_CACHE_DIR" --scanners vuln,license --format json --output build/reports/cyclonedx/trivy-all-configs-bom.json build/reports/cyclonedx/all-configs-bom.json
        shell: bash 

      - name: Convert Complete Application SBOM Vulnerabilities to SARIF
        run: |
          trivy convert \
            --format sarif \
            --output build/reports/cyclonedx/trivy-all-configs-bom.sarif \
            build/reports/cyclonedx/trivy-all-configs-bom.json
        shell: bash

      - name: Upload Complete Application SBOM SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/cyclonedx/trivy-all-configs-bom.sarif
          category: trivy-application-sbom

      - name: Generate TRIVY Enhanced Complete SBOM Report
        run: |
          python3 trivy/generate_sbom_report-v8.py --sbom build/reports/cyclonedx/all-configs-bom.json --trivy build/reports/cyclonedx/trivy-all-configs-bom.json --output build/reports/cyclonedx/all-configs-bom.html
        shell: bash 

##############################  Build Environment SBOM #########################################################

      - name: Generate CSV Version of Build Environment SBOM 
        run: |
           cyclonedx convert --input-file build/reports/cyclonedx/build-environment-bom.json --output-file build/reports/cyclonedx/build-environment-bom.csv --output-format csv
        shell: bash    

      - name: Scan Build Environment SBOM with Trivy
        run: |
          trivy sbom --cache-dir "$TRIVY_CACHE_DIR" --scanners vuln,license --format json --output build/reports/cyclonedx/trivy-build-environment-bom.json build/reports/cyclonedx/build-environment-bom.json
        shell: bash 

      - name: Convert Build Application SBOM Vulnerabilities to SARIF
        run: |
          trivy convert \
            --format sarif \
            --output build/reports/cyclonedx/trivy-build-environment-bom.sarif \
            build/reports/cyclonedx/trivy-build-environment-bom.json
        shell: bash

      - name: Upload Complete Application SBOM SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/cyclonedx/trivy-build-environment-bom.sarif
          category: trivy-build-environment-sbom
        
      - name: Generate TRIVY Enhanced Complete SBOM Report
        run: |
          python3 trivy/generate_sbom_report-v8.py --sbom build/reports/cyclonedx/build-environment-bom.json --trivy build/reports/cyclonedx/trivy-build-environment-bom.json --output build/reports/cyclonedx/build-environment-bom.html
        shell: bash 

      - name: Upload Reports 
        uses: actions/upload-artifact@master
        if: always()
        with:
            name: sbom-reports
            path: | 
             build/reports/cyclonedx/
            retention-days: 1
