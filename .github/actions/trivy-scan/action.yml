# Design Notes:

# Gradle uses CycloneDX to Produce the Runtime, Application and Build Chain SBOM with direct and transitive dependencies report using the gradle.lockfile as it is best tool to do this
# Trivy scans include Source Code Scan, Build Artefact Scan (JAR), Docker Image Scan and Configuration Scan. 
# Trivy Secrets Scan and using Trivy to Enrich the SBOMs produces by CycloneDX are handled through other composite actions
# Trivy Source Code Scan: 
##### This stage scans all of the code in the repository, identifies its components and then determines the licences and vulnerabilities associated with each component.
##### It uses the gradle.lock file, build.gradle and other files natively to perform this analysis
# Trivy Build Artefact Scan (JAR File)
##### This stage performs a similar scan to the Source Code Scan however it only scans the nested dependencies in the JAR. In other words, the JAR files that are required to **RUN** the application.
##### The solution has a CycloneDX Runtime SBOM with Trivy Enrichment. There is some overlap with this scan and it should produce the same result however they answer different questions.
##### The gradle scan answers 'what open source libraries does gradle think are required to run the application' and this answers 'what libraries are in the final JAR file'
##### Trivy's Documentation recommends unpacking the JAR Files and there can be some challenges with scanning nested JAR
# Trivy Scan Docker Image
##### This stage scans for what is present in the Deployable Container Image 
##### This includes OS packages/libraries, container packages, Java Runtime vulnerabilities (eg: java -version), the JAR file, configuration files, openssl, libc, curl, certificates
# Trivy Configuration Scan 
##### This stage helps to identify misconfigurations in HELM Charts, Docker FIles, IAC, Configuration files etc. 
# Why are we using the Github Action for Trivy?
#### The Github action for trivy scans isn't maintained regularly. 
#### Therefore this composite action install trivy and we run CLI commands to ensure we are using the latest version and capabilities of trivy.

name: 'Trivy Security Scan'
description: 'Trivy dependency, license, packaged JAR, container, and configuration scanning with SARIF and workflow artifacts.'

inputs:
  image-ref:
    description: 'Container image reference to scan'
    required: false
    default: 'java-application:${{ github.sha }}'
  trivy-version:
    description: 'Trivy CLI version to install and use'
    required: false
    default: '0.74.0'

runs:
  using: 'composite'
  steps:
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Download Build Artefact
      uses: actions/download-artifact@v8
      with:
        name: build
        path: .

    - name: Download SBOM Reports
      uses: actions/download-artifact@v8
      with:
        name: sbom-reports
        path: build/reports/cyclonedx

    - name: Setup Trivy
      uses: frankbuttigieg1993-gmail/cicd/.github/actions/common/setup-trivy@main

    ################################################### Trivy Source Dependency Scan ####################################################

    - name: Trivy Source Dependency and License Scan
      shell: bash
      run: |
        bash "${{ github.action_path }}/resources/run-trivy-dependency-license-scan.sh"

    - name: Upload Source Dependency and License SARIF
      if: ${{ always() && github.event_name != 'pull_request' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: build/reports/trivy/trivy-source-dependencies-license.sarif
        category: trivy-source-dependencies-license

    ################################################### Trivy Packaged JAR Scan ########################################################

    - name: Trivy Packaged JAR Scan
      shell: bash
      run: |
        bash "${{ github.action_path }}/resources/run-trivy-jar-scan.sh"

    - name: Upload Packaged JAR Vulnerability and License SARIF
      if: ${{ always() && github.event_name != 'pull_request' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: build/reports/trivy/trivy-packaged-jar.sarif
        category: trivy-packaged-jar

    ################################################### Trivy Docker Image Scan ########################################################

    - name: Build and Scan Docker Image
      id: docker-image-scan
      shell: bash
      env:
        INPUT_IMAGE_REF: java-application:${{ github.sha }}
      run: |
        bash "${{ github.action_path }}/resources/run-trivy-docker-image-scan.sh"

    - name: Upload Docker Image Vulnerability and License SARIF
      if: ${{ always() && github.event_name != 'pull_request' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: build/reports/trivy/trivy-docker-image.sarif
        category: trivy-docker-image

    ################################################### Trivy Configuration Scan #######################################################

    - name: Trivy Configuration Scan
      shell: bash
      run: |
        bash "${{ github.action_path }}/resources/run-trivy-config-scan.sh"

    - name: Upload Trivy Configuration SARIF
      if: ${{ always() && github.event_name != 'pull_request' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: build/reports/trivy/trivy-configuration.sarif
        category: trivy-configuration

    ################################################### Trivy Reports ##################################################################

    - name: Upload Trivy Reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: trivy-scan-reports
        path: build/reports/trivy/
        retention-days: 7
        if-no-files-found: error

    - name: Clean up Trivy workspace
      if: always()
      uses: tiacsys/clean-after-action@v4
